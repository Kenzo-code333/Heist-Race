<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heist Race</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The 3D view is drawn into this element -->
    <div id="game"></div>

    <!-- HUD: always-visible information drawn on top of the 3D view -->
    <div id="hud">
      <div id="hud-top-left">
        <div class="hud-title">HEIST RACE</div>
        <div id="hud-room">—</div>
      </div>
      <div id="hud-top-right">
        <span id="hud-server-dot" class="dot"></span>
        <span id="hud-server-text">Server: connecting…</span>
      </div>
      <div id="hud-bottom-left">
        <div id="hud-stance-label">STANDING</div>
        <div id="hud-stance-bars"><span></span><span></span><span></span></div>
        <div id="hud-stance-hint">Noise level</div>
      </div>
      <div id="hud-crosshair"></div>
    </div>

    <!-- Shown when the mouse is not captured (start / after pressing Esc) -->
    <div id="overlay">
      <div class="overlay-card">
        <h1>HEIST RACE</h1>
        <p class="subtitle">Milestone 1 — walk the building</p>
        <button id="play-button">Click to play</button>
        <table class="controls">
          <tr><td>W A S D</td><td>Move (Z Q S D on AZERTY)</td></tr>
          <tr><td>Mouse</td><td>Look around</td></tr>
          <tr><td>Shift (hold)</td><td>Run — loud</td></tr>
          <tr><td>C</td><td>Toggle crouch-sneak — silent</td></tr>
          <tr><td>Esc</td><td>Release the mouse</td></tr>
        </table>
        <p id="loading-text">Building the vault…</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
